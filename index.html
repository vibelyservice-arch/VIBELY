<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vibely — Global Social Network & Affiliate Marketing Academy Enterprise Engine</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Paystack Inline SDK -->
  <script src="https://js.paystack.co/v1/inline.js"></script>

  <!-- Tailwind Custom Design Extension -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#9333ea',
              indigo: '#6366f1',
              pink: '#ec4899',
              teal: '#14b8a6',
              amber: '#f59e0b',
              dark: '#050508',
              surface: '#0b0b12',
              card: '#12121e'
            }
          },
          animation: {
            'glow-pulse': 'glow 8s ease-in-out infinite',
            'float': 'float 5s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s infinite'
          },
          keyframes: {
            glow: {
              '0%, 100%': { opacity: '0.15', transform: 'scale(1)' },
              '50%': { opacity: '0.3', transform: 'scale(1.15)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' }
            }
          }
        }
      }
    }
  </script>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #050508;
      color: #f4f4f5;
    }
    .glass-nav {
      background: rgba(11, 11, 18, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(18, 18, 30, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-panel {
      background: rgba(14, 14, 23, 0.97);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .text-glow { text-shadow: 0 0 25px rgba(168, 85, 247, 0.4); }
    .btn-tap-target {
      min-width: 44px;
      min-height: 44px;
      touch-action: manipulation;
    }
    .chip-active {
      background-color: #9333ea !important;
      color: #ffffff !important;
      border-color: #c084fc !important;
      box-shadow: 0 0 12px rgba(147, 51, 234, 0.4);
    }
  </style>
</head>

<body class="min-h-screen pb-28 selection:bg-purple-600 selection:text-white overflow-x-hidden">

  <!-- LUXURY AMBIENT BACKGROUND GLOWS -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[380px] sm:w-[850px] h-[380px] sm:h-[850px] bg-purple-600/18 rounded-full blur-[150px] animate-glow-pulse"></div>
    <div class="absolute top-1/2 -right-40 w-[300px] sm:w-[650px] h-[300px] sm:h-[650px] bg-indigo-600/12 rounded-full blur-[170px] animate-glow-pulse" style="animation-delay: 2.5s;"></div>
    <div class="absolute -bottom-40 -left-40 w-[350px] sm:w-[700px] h-[350px] sm:h-[700px] bg-pink-600/12 rounded-full blur-[160px] animate-glow-pulse" style="animation-delay: 4.5s;"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#ffffff0a_1px,transparent_1px)] [background-size:24px_24px]"></div>
  </div>

  <!-- TAP TO ENTER CHIME OVERLAY -->
  <div 
    id="splash-screen" 
    onclick="enterVibely()"
    class="fixed inset-0 z-50 bg-[#050508]/95 backdrop-blur-3xl flex flex-col items-center justify-center p-6 text-center cursor-pointer transition-all duration-700 ease-out"
  >
    <div class="relative mb-6 animate-float">
      <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-purple-600 via-pink-500 to-indigo-600 p-[1.5px] shadow-2xl shadow-purple-600/40">
        <div class="w-full h-full bg-[#0a0a0f] rounded-3xl flex items-center justify-center">
          <svg class="w-9 h-9 text-white fill-current translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
        </div>
      </div>
      <div class="absolute -inset-2 bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl blur-xl opacity-35 animate-pulse -z-10"></div>
    </div>
    <h2 class="text-3xl font-black tracking-[0.25em] uppercase bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">VIBELY</h2>
    <p class="text-[10px] uppercase tracking-[0.3em] text-purple-400 mt-2 font-bold px-3 py-1 rounded-full border border-purple-500/20 bg-purple-500/10">Tap Screen To Enter Universe Experience</p>
  </div>
